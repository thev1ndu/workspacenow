apiVersion: v1
kind: ConfigMap
metadata:
  name: wsn-observer
data:
  WSN_OBSERVER_PORT: "9098"
  WSN_OBSERVER_LOG_LEVEL: INFO
  # Telemetry is stored as append-only segment files under /data (no database); a PVC keeps it across restarts.
  WSN_OBSERVER_DATA_DIR: "/data"
  WSN_OBSERVER_RETENTION_BYTES: "268435456"
  WSN_OBSERVER_SEGMENT_BYTES: "33554432"
  WSN_OBSERVER_SCAN_LIMIT: "100000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wsn-observer
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: wsn-observer }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wsn-observer }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: wsn-observer-data }
      containers:
        - name: observer
          image: wsn-observer
          ports:
            - { name: http, containerPort: 9098 }
          envFrom:
            - configMapRef: { name: wsn-observer }
          env:
            - name: WSN_OBSERVER_TOKEN
              valueFrom:
                secretKeyRef: { name: wsn-secrets, key: OBSERVER_TOKEN, optional: true }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata:
  name: wsn-observer
spec:
  selector: { app.kubernetes.io/name: wsn-observer }
  ports:
    - { name: http, port: 9098, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wsn-observer
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: wsn-observer }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wsn-observer-data
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
