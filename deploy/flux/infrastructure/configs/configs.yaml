# Instances of the operators installed by infrastructure/controllers.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wsn-db
  namespace: workspacenow
spec:
  instances: 3
  storage:
    size: 20Gi
  bootstrap:
    initdb:
      database: workspacenow
      owner: workspacenow
      postInitSQL:
        - CREATE ROLE temporal LOGIN CREATEDB
        - CREATE DATABASE temporal OWNER temporal
        - CREATE DATABASE temporal_visibility OWNER temporal
  managed:
    roles:
      - name: temporal
        ensure: present
        login: true
        passwordSecret:
          name: temporal-db-login
---
# OpenBao, reached with the Kubernetes auth role external-secrets.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# Platform secrets; values live in OpenBao under secret/workspacenow and never in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wsn-secrets
  namespace: workspacenow
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: wsn-secrets }
  data:
    - { secretKey: MISTRAL_API_KEY, remoteRef: { key: workspacenow/mistral, property: apiKey } }
    - { secretKey: AI_SERVICE_TOKEN, remoteRef: { key: workspacenow/ai-service, property: token } }
    - { secretKey: OBSERVER_TOKEN, remoteRef: { key: workspacenow/observer, property: token } }
    - { secretKey: RUN_GRANT_KEY, remoteRef: { key: workspacenow/run-grant, property: privateKey } }
    - { secretKey: S3_ACCESS_KEY, remoteRef: { key: workspacenow/object-storage, property: accessKey } }
    - { secretKey: S3_SECRET_KEY, remoteRef: { key: workspacenow/object-storage, property: secretKey } }
    - { secretKey: WSN_LOCAL_ADMIN_EMAIL, remoteRef: { key: workspacenow/local-admin, property: email } }
    - { secretKey: WSN_LOCAL_ADMIN_PASSWORD, remoteRef: { key: workspacenow/local-admin, property: password } }
---
# Object-storage credentials for the RustFS deployment, pulled from OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wsn-rustfs-env
  namespace: workspacenow
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: wsn-rustfs-env
    template:
      data:
        accessKey: "{{ .accessKey }}"
        secretKey: "{{ .secretKey }}"
  data:
    - { secretKey: accessKey, remoteRef: { key: workspacenow/object-storage, property: accessKey } }
    - { secretKey: secretKey, remoteRef: { key: workspacenow/object-storage, property: secretKey } }
---
# Object storage for documents and release artifacts: RustFS (S3-compatible, MinIO-compatible
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: workspacenow
spec:
  replicas: 1
  selector: { matchLabels: { app: rustfs } }
  template:
    metadata:
      labels: { app: rustfs }
    spec:
      # dev cluster: the rustfs image uses a non-numeric user, so runAsNonRoot cannot be verified
      securityContext: { runAsNonRoot: false, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: rustfs
          image: docker.io/rustfs/rustfs:1.0.4
          args: ["server", "/data"]
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: wsn-rustfs-env, key: accessKey } }
            - name: RUSTFS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: wsn-rustfs-env, key: secretKey } }
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: rustfs-data }
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: workspacenow
spec:
  selector: { app: rustfs }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: workspacenow
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi

---
# One-time OpenBao setup: Kubernetes auth + the roles ESO and wsn-service use, plus the KV
# seed paths (fill real values later with deploy/flux/platform/openbao-seed.sh).
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-config
  namespace: openbao
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bao
          image: openbao/openbao:2.1.0
          env:
            - { name: BAO_ADDR, value: "http://openbao.openbao.svc:8200" }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for i in $(seq 1 60); do bao status >/dev/null 2>&1 && break; sleep 5; done
              bao login root >/dev/null
              bao auth list -format=json | grep -q kubernetes || bao auth enable kubernetes
              bao read auth/kubernetes/config >/dev/null 2>&1 || bao write auth/kubernetes/config kubernetes_host=https://kubernetes.default.svc kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              bao policy write workspacenow-read - <<'POL'
              path "secret/data/workspacenow/*" { capabilities = ["read", "list", "update"] }
              path "secret/metadata" { capabilities = ["list"] }
              path "secret/metadata/workspacenow" { capabilities = ["read", "list"] }
              path "secret/metadata/workspacenow/*" { capabilities = ["read", "list"] }
              POL
              bao write auth/kubernetes/role/external-secrets bound_service_account_names=external-secrets bound_service_account_namespaces=external-secrets policies=workspacenow-read ttl=1h
              bao write auth/kubernetes/role/wsn-service bound_service_account_names=wsn-service bound_service_account_namespaces=workspacenow policies=workspacenow-read ttl=1h
              bao secrets list -format=json | grep -q '"secret/"' || bao secrets enable -path=secret kv-v2
              seed() { # seed <path> <key=value...> — write only when the key is empty, never clobber
                path="$1"; shift
                for kv in "$@"; do key="${kv%%=*}"
                  cur=$(bao kv get -field="$key" -mount=secret "$path" 2>/dev/null || true)
                  [ -n "$cur" ] || bao kv put -mount=secret "$path" "$kv" >/dev/null
                done
              }
              seed workspacenow/mistral apiKey=change-me
              seed workspacenow/ai-service token=change-me
              seed workspacenow/observer token=change-me
              seed workspacenow/run-grant privateKey=change-me
              seed workspacenow/object-storage accessKey=workspacenow secretKey=workspacenow-secret
              seed workspacenow/temporal-db password=temporal-dev
              seed workspacenow/local-admin email=admin@workspacenow.local password=$(head -c 24 /dev/urandom | base64 | tr -d '\n')
              echo "openbao configured"
