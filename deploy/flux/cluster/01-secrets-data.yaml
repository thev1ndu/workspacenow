# Layer 01: OpenBao setup, secret store and synced secrets, the wsn-db Postgres cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 01-secrets-data
  namespace: flux-system
spec:
  dependsOn:
    - name: 00-foundation
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./deploy/flux/layers/01-secrets-data
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
