# Local WorkspaceNow infrastructure (make -C wsn-service deps); production uses deploy/flux.
name: workspacenow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workspacenow
      POSTGRES_PASSWORD: workspacenow
      POSTGRES_DB: workspacenow
    ports: ["5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspacenow"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: ["nats:/data"]

  # Temporal's development server: a single process with an in-memory or sqlite store and the web UI on :8233.
  temporal:
    image: temporalio/temporal:1.4.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports: ["7233:7233", "8233:8233"]
    volumes: ["temporal:/data"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: workspacenow
      MINIO_ROOT_PASSWORD: workspacenow-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 workspacenow workspacenow-secret; do sleep 1; done;
      mc mb --ignore-existing local/workspacenow"

  # OpenBao in dev mode: root token "root", KV v2 at secret/. Integration credentials live here.
  openbao:
    image: openbao/openbao:2.2.0
    command: ["server", "-dev", "-dev-root-token-id=root", "-dev-listen-address=0.0.0.0:8200"]
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]

volumes:
  postgres: {}
  nats: {}
  temporal: {}
  minio: {}
