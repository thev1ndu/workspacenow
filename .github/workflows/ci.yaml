name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"] # release tags run the full suite (incl. e2e) before images build

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists a PR's changed files

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      service: ${{ steps.publish.outputs.service }}
      observer: ${{ steps.publish.outputs.observer }}
      console: ${{ steps.publish.outputs.console }}
      deploy: ${{ steps.publish.outputs.deploy }}
      ai: ${{ steps.publish.outputs.ai }}
    steps:
      - uses: actions/checkout@v7
      # paths-filter only understands pull_request events; on push (branch or release tag)
      # it fails and would skip every downstream job, so non-PR events mark all changed.
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            service: ['wsn-service/**', 'openapi.yaml']
            observer: ['wsn-observer/**']
            ai: ['wsn-ai-service/**']
            console: ['console/**']
            deploy: ['deploy/**']
      - name: All components changed on non-PR events
        if: github.event_name != 'pull_request'
        id: all
        run: |
          for k in service observer console deploy ai; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
      - name: Publish merged outputs
        id: publish
        run: |
          echo "service=${{ steps.filter.outputs.service == 'true' || steps.all.outputs.service == 'true' }}" >> "$GITHUB_OUTPUT"
          echo "observer=${{ steps.filter.outputs.observer == 'true' || steps.all.outputs.observer == 'true' }}" >> "$GITHUB_OUTPUT"
          echo "console=${{ steps.filter.outputs.console == 'true' || steps.all.outputs.console == 'true' }}" >> "$GITHUB_OUTPUT"
          echo "deploy=${{ steps.filter.outputs.deploy == 'true' || steps.all.outputs.deploy == 'true' }}" >> "$GITHUB_OUTPUT"
          echo "ai=${{ steps.filter.outputs.ai == 'true' || steps.all.outputs.ai == 'true' }}" >> "$GITHUB_OUTPUT"

  # The AI service's gate (ruff + mypy + 100% line coverage) lives here as a job, so one
  # pipeline covers everything; the live Mistral smoke test is opt-in via the secret.
  wsn-ai-service:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wsn-ai-service
    env:
      HAS_MISTRAL_KEY: ${{ secrets.MISTRAL_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wsn-ai-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      # The coverage gate: every line of src must be exercised by the unit tests.
      - run: pytest --cov=src --cov-report=term-missing --cov-fail-under=100
      - name: Live smoke test against Mistral (opt-in, needs the repository secret)
        if: ${{ env.HAS_MISTRAL_KEY == 'true' }}
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          AI_SERVICE_TOKEN: ${{ secrets.AI_SERVICE_TOKEN }}
        run: pytest tests/test_live_smoke.py -v

  wsn-service:
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wsn-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: wsn-service/go.mod
          cache-dependency-path: wsn-service/go.sum
      - name: Generated code is current
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.6.0 -config api/oapi-codegen.yaml ../openapi.yaml
          sh scripts/gen-unimplemented.sh
          git diff --exit-code -- internal/oapi api/unimplemented_gen.go
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
      - run: go test -race -covermode=atomic ./...
      - run: go build ./...

  wsn-observer:
    needs: changes
    if: needs.changes.outputs.observer == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wsn-observer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: wsn-observer/go.mod
          cache-dependency-path: wsn-observer/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
      - run: go test -race -covermode=atomic ./...
      - run: go build ./...

  console:
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @workspacenow/mock-server test:coverage
      - run: pnpm test # every workspace with a test script (mock-server, pages, …)
      - run: pnpm build

  # Full e2e: boot the whole compose stack and run the flagship smoke against the live API.
  e2e:
    needs: changes
    if: needs.changes.outputs.service == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Boot the compose stack
        run: |
          docker compose -f deploy/compose/docker-compose.yml --profile app up -d --build || {
            echo "::error::compose up failed — container states and logs:"
            docker compose -f deploy/compose/docker-compose.yml --profile app ps -a
            docker compose -f deploy/compose/docker-compose.yml --profile app logs --tail=300
            exit 1
          }
      - name: Run e2e smoke
        run: bash deploy/e2e/smoke.sh
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose/docker-compose.yml --profile app ps -a
          docker compose -f deploy/compose/docker-compose.yml --profile app logs --tail=300
      - name: Teardown
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml --profile app down -v

  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: fluxcd/flux2/action@v2.10.0
      - name: Render every Flux overlay
        run: |
          for dir in deploy/flux/infrastructure/controllers deploy/flux/infrastructure/configs deploy/flux/apps/dev deploy/flux/apps/staging deploy/flux/apps/prod; do
            echo "::group::$dir"
            kubectl kustomize "$dir" > /dev/null
            echo "::endgroup::"
          done
