# Four hostnames, one gateway: console, API, MCP (ai-service), observer.
# Environments patch the hostnames (see apps/<env>/kustomization.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console
spec:
  parentRefs:
    - name: workspacenow
      namespace: workspacenow
      sectionName: https-console
  hostnames: ["console.workspacenow.example.com"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: console, port: 8080 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
    - name: workspacenow
      namespace: workspacenow
      sectionName: https-api
  hostnames: ["api.workspacenow.example.com"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: wsn-service, port: 8080 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
spec:
  parentRefs:
    - name: workspacenow
      namespace: workspacenow
      sectionName: https-ai
  hostnames: ["ai.workspacenow.example.com"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: wsn-ai-service, port: 8090 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: observer
spec:
  parentRefs:
    - name: workspacenow
      namespace: workspacenow
      sectionName: https-obs
  hostnames: ["obs.workspacenow.example.com"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: wsn-observer, port: 9098 }]
---
# The ai-service is reached only by wsn-service and the gateway (for /mcp).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wsn-ai-service
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: wsn-ai-service }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: wsn-service } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: wsn-service-worker } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: workspacenow } }
      ports: [{ port: 8090 }]
---
# The observer takes OTLP telemetry from the platform services and serves queries to the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wsn-observer
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: wsn-observer }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: wsn-service } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: wsn-service-worker } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: wsn-ai-service } }
      ports: [{ port: 9098 }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: workspacenow } }
      ports: [{ port: 9098 }]
---
# The console serves static files and is reached only by the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: console }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: workspacenow } }
      ports: [{ port: 8080 }]
---
# The internal API (tool calls with run grants) accepts only the ai-service; the public API is open to the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wsn-service
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: wsn-service }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: wsn-ai-service } }
      ports: [{ port: 8081 }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: workspacenow } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: wsn-ai-service } }
      ports: [{ port: 8080 }]
