# Cloud Native Buildpacks descriptor: pack build wsn-console --builder paketobuildpacks/builder-jammy-base
[_]
schema-version = "0.2"
id = "workspacenow.wsn-console"
name = "wsn-console"

[io.buildpacks]
exclude = ["node_modules", "apps/web-ui/dist"]

[[io.buildpacks.build.env]]
name = "BP_NODE_VERSION"
value = "22.*"

[[io.buildpacks.build.env]]
name = "BP_NODE_RUN_SCRIPTS"
value = "build"

[[io.buildpacks.build.env]]
name = "BP_WEB_SERVER"
value = "nginx"

[[io.buildpacks.build.env]]
name = "BP_WEB_SERVER_ROOT"
value = "apps/web-ui/dist"

[[io.buildpacks.build.env]]
name = "BP_WEB_SERVER_ENABLE_PUSH_STATE"
value = "true"
