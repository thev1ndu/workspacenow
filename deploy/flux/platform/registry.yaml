# In-cluster OCI registry (registry:2) exposed over HTTPS through the kgateway
# gateway at registry.workspace.twotakeone.com (dev: registry.workspace.twotakeone.com).
# Kaniko/kpack push here; kubelet pulls from the same public hostname.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: workspacenow
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: registry }
  template:
    metadata:
      labels: { app.kubernetes.io/name: registry }
    spec:
      containers:
        - name: registry
          image: registry:2
          ports: [{ containerPort: 5000 }]
          env:
            - { name: REGISTRY_HTTP_TLS_CERTIFICATE, value: /tls/tls.crt }
            - { name: REGISTRY_HTTP_TLS_KEY, value: /tls/tls.key }
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: data, mountPath: /var/lib/registry }
          resources: { requests: { cpu: 100m, memory: 256Mi } }
      volumes:
        - { name: tls, secret: { secretName: tls-registry } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: workspacenow
spec:
  selector: { app.kubernetes.io/name: registry }
  ports: [{ port: 5000, targetPort: 5000 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: registry
  namespace: workspacenow
spec:
  parentRefs:
    - { name: workspacenow, namespace: workspacenow }
  hostnames: ["registry.workspace.twotakeone.com"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: registry, port: 5000 }]
