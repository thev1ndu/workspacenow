# Platform secrets; values live in OpenBao under secret/workspacenow and never in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wsn-secrets
  namespace: workspacenow
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: wsn-secrets }
  data:
    - { secretKey: MISTRAL_API_KEY, remoteRef: { key: workspacenow/mistral, property: apiKey } }
    - { secretKey: AI_SERVICE_TOKEN, remoteRef: { key: workspacenow/ai-service, property: token } }
    - { secretKey: OBSERVER_TOKEN, remoteRef: { key: workspacenow/observer, property: token } }
    - { secretKey: RUN_GRANT_KEY, remoteRef: { key: workspacenow/run-grant, property: privateKey } }
    - { secretKey: S3_ACCESS_KEY, remoteRef: { key: workspacenow/object-storage, property: accessKey } }
    - { secretKey: S3_SECRET_KEY, remoteRef: { key: workspacenow/object-storage, property: secretKey } }
    - { secretKey: WSN_DEFAULT_ADMIN_EMAIL, remoteRef: { key: workspacenow/default-admin, property: email } }
    - { secretKey: WSN_DEFAULT_ADMIN_PASSWORD, remoteRef: { key: workspacenow/default-admin, property: password } }
---
# Object-storage credentials for RustFS (layer 02); the {{ }} templates are ESO's, not Flux variables.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wsn-rustfs-env
  namespace: workspacenow
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: wsn-rustfs-env
    template:
      data:
        accessKey: "{{ .accessKey }}"
        secretKey: "{{ .secretKey }}"
  data:
    - { secretKey: accessKey, remoteRef: { key: workspacenow/object-storage, property: accessKey } }
    - { secretKey: secretKey, remoteRef: { key: workspacenow/object-storage, property: secretKey } }
---
# Temporal's database login: wsn-db's managed role reads it here, the Temporal chart reads the copy in namespace temporal.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-db
  namespace: workspacenow
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: temporal-db-login
    template:
      type: kubernetes.io/basic-auth
      data:
        username: temporal
        password: "{{ .password }}"
  data:
    - { secretKey: password, remoteRef: { key: workspacenow/temporal-db, property: password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-db
  namespace: temporal
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: temporal-db }
  data:
    - { secretKey: password, remoteRef: { key: workspacenow/temporal-db, property: password } }
