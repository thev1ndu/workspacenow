apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - image-automation.yaml
images:
  - name: ghcr.io/thev1ndu/wsn-service
    newTag: main # {"$imagepolicy": "flux-system:wsn-service:tag"}
  - name: ghcr.io/thev1ndu/wsn-ai-service
    newTag: main # {"$imagepolicy": "flux-system:wsn-ai-service:tag"}
  - name: ghcr.io/thev1ndu/wsn-console
    newTag: main # {"$imagepolicy": "flux-system:wsn-console:tag"}
replicas:
  - { name: wsn-service, count: 1 }
  - { name: wsn-service-worker, count: 1 }
  - { name: wsn-ai-service, count: 1 }
  - { name: wsn-console, count: 1 }
patches:
  - target: { kind: ConfigMap, name: wsn-service }
    patch: |
      - { op: replace, path: /data/WSN_ENV, value: development }
      - { op: replace, path: /data/WSN_DEMO_MODE, value: "true" }
      - { op: replace, path: /data/LOG_LEVEL, value: DEBUG }
      - { op: replace, path: /data/CORS_ALLOWED_ORIGINS, value: https://dev.workspacenow.example.com }
  - target: { kind: ConfigMap, name: wsn-console }
    patch: |
      - op: replace
        path: /data/config.js
        value: |
          window.__RUNTIME_CONFIG__ = { organizationName: "Northwind Retail", installationName: "Northwind WorkspaceNow (dev)", version: "dev", mockLatencyMs: 0, apiBaseUrl: "https://dev.workspacenow.example.com" };
  - target: { kind: HTTPRoute, name: workspacenow }
    patch: |
      - { op: replace, path: /spec/hostnames, value: [dev.workspacenow.example.com] }
