# Sessions, caching, rate limits and run-grant counters (Redis protocol).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: workspacenow
spec:
  interval: 1h
  chart:
    spec:
      chart: valkey
      version: "0.x"
      sourceRef: { kind: HelmRepository, name: valkey, namespace: flux-system }
  values:
    dataStorage: { enabled: true, requestedSize: 5Gi }
