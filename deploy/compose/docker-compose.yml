# WorkspaceNow local stack. Production uses deploy/flux. Run it from the repo root:
#
#   make setup    create .env from .env.example (first run only)
#   make up       full stack: infra + observer + wsn-service (+worker) + ai-service + console
#   make down     stop everything (volumes kept)
#
# (.env lives at the repo root and is passed with --env-file; running compose directly from this
# directory without --env-file falls back to the defaults in each ${VAR:-default} below.)
# Images default to the GHCR main builds; `make build` builds them locally instead.
name: workspacenow

x-wsn-service-env: &wsn-service-env
  WSN_ENV: development
  WSN_DEMO_MODE: "true"
  LOG_LEVEL: DEBUG
  DATABASE_URL: postgres://${POSTGRES_USER:-workspacenow}:${POSTGRES_PASSWORD:-workspacenow}@postgres:5432/${POSTGRES_DB:-workspacenow}?sslmode=disable
  REDIS_URL: redis://valkey:6379/0
  NATS_URL: nats://nats:4222
  NATS_STREAM: WSN_EVENTS
  TEMPORAL_HOSTPORT: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: workspacenow-workflows
  S3_ENDPOINT: minio:9000
  S3_BUCKET: workspacenow
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-workspacenow}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-workspacenow-secret}
  S3_USE_SSL: "false"
  OPENBAO_ADDR: http://openbao:8200
  OPENBAO_TOKEN: ${OPENBAO_ROOT_TOKEN:-root}
  AI_SERVICE_URL: http://wsn-ai-service:8090
  AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-service-token}
  WSN_OBSERVER_URL: http://wsn-observer:9098
  WSN_OBSERVER_TOKEN: ${OBSERVER_TOKEN:-}
  CORS_ALLOWED_ORIGINS: http://localhost:8088
  # OIDC_ISSUER / OIDC_JWKS_URL stay empty in demo mode (persona tokens); set them to switch to real OIDC.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workspacenow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workspacenow}
      POSTGRES_DB: ${POSTGRES_DB:-workspacenow}
    ports: ["5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspacenow"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: ["nats:/data"]

  # Temporal's development server: a single process with an in-memory or sqlite store and the web UI on :8233.
  temporal:
    image: temporalio/temporal:1.4.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports: ["7233:7233", "8233:8233"]
    volumes: ["temporal:/data"]

  # S3-compatible object storage. MinIO's public images now require a login on both Docker Hub
  # and quay.io, so the local stack runs RustFS — a drop-in MinIO-compatible server on the same
  # ports (9000 API / 9001 console). Production (Flux) runs the real MinIO operator; the S3 API
  # and the path-style client in wsn-service are identical either way.
  minio:
    image: rustfs/rustfs:1.0.4
    command: ["server", "/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-workspacenow}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-workspacenow-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  minio-init:
    image: amazon/aws-cli:2.39.6
    depends_on: [minio]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-workspacenow}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-workspacenow-secret}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do sleep 1; done;
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket ${S3_BUCKET:-workspacenow} || true

  # OpenBao in dev mode: root token "root", KV v2 at secret/. Integration credentials live here.
  openbao:
    image: openbao/openbao:2.2.0
    command: ["server", "-dev", "-dev-root-token-id=${OPENBAO_ROOT_TOKEN:-root}", "-dev-listen-address=0.0.0.0:8200"]
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]

  # ---- app profile: the platform itself (docker compose --profile app up -d) ----

  wsn-observer:
    profiles: ["app"]
    image: ghcr.io/thev1ndu/wsn-observer:${IMAGE_TAG:-main}
    build: ../../wsn-observer
    environment:
      WSN_OBSERVER_DATA_DIR: /data
      WSN_OBSERVER_TOKEN: ${OBSERVER_TOKEN:-}
    ports: ["9098:9098"]
    volumes: ["observer:/data"]

  wsn-service-migrate:
    profiles: ["app"]
    image: ghcr.io/thev1ndu/wsn-service:${IMAGE_TAG:-main}
    build: ../../wsn-service
    command: ["-migrate", "-server=false"]
    environment: *wsn-service-env
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    restart: "no"

  # Backup restore drill: restores Postgres from the newest (or -backup-id) backup in MinIO and exits.
  # Run against a scratch database: docker compose --profile restore run --rm wsn-service-restore
  wsn-service-restore:
    profiles: ["restore"]
    image: ghcr.io/thev1ndu/wsn-service:${IMAGE_TAG:-main}
    build: ../../wsn-service
    command: ["-restore", "-server=false"]
    environment: *wsn-service-env
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    restart: "no"

  wsn-service:
    profiles: ["app"]
    image: ghcr.io/thev1ndu/wsn-service:${IMAGE_TAG:-main}
    build: ../../wsn-service
    command: ["-server", "-relay"]
    environment: *wsn-service-env
    ports: ["8080:8080", "8081:8081"]
    depends_on:
      wsn-service-migrate: { condition: service_completed_successfully }
      wsn-observer: { condition: service_started }
      wsn-ai-service: { condition: service_started }

  wsn-service-worker:
    profiles: ["app"]
    image: ghcr.io/thev1ndu/wsn-service:${IMAGE_TAG:-main}
    build: ../../wsn-service
    command: ["-server=false", "-worker"]
    environment: *wsn-service-env
    depends_on:
      wsn-service-migrate: { condition: service_completed_successfully }
      temporal: { condition: service_started }

  wsn-ai-service:
    profiles: ["app"]
    image: ghcr.io/thev1ndu/wsn-ai-service:${IMAGE_TAG:-main}
    build: ../../wsn-ai-service
    environment:
      PORT: 8090
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-service-token}
      PLATFORM_INTERNAL_URL: http://wsn-service:8081
      PLATFORM_API_URL: http://wsn-service:8080
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      WSN_OBSERVER_URL: http://wsn-observer:9098
      WSN_OBSERVER_TOKEN: ${OBSERVER_TOKEN:-}
    ports: ["8090:8090"]
    # No depends_on wsn-service: wsn-service already waits for this service, and a back-edge
    # would be a dependency cycle. The AI service calls back to wsn-service's internal API.

  console:
    profiles: ["app"]
    image: ghcr.io/thev1ndu/console:${IMAGE_TAG:-main}
    build: ../../console
    ports: ["8088:8080"]
    volumes: ["../../console-config.js:/usr/share/nginx/html/config.js:ro"]
    depends_on:
      wsn-service: { condition: service_started }

volumes:
  postgres: {}
  nats: {}
  temporal: {}
  minio: {}
  observer: {}
