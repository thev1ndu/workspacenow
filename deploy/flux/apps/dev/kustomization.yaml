apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
# Images are built in-cluster (kaniko/kpack, see deploy/flux/platform) and pushed to the
# in-cluster registry; dev pins the fixed tag "dev" instead of following GHCR.
images:
  - name: ghcr.io/thev1ndu/wsn-service
    newName: 169.58.222.26/wsn-service
    newTag: dev
  - name: ghcr.io/thev1ndu/wsn-ai-service
    newName: 169.58.222.26/wsn-ai-service
    newTag: dev
  - name: ghcr.io/thev1ndu/wsn-observer
    newName: 169.58.222.26/wsn-observer
    newTag: dev
  - name: ghcr.io/thev1ndu/console
    newName: 169.58.222.26/console
    newTag: dev
replicas:
  - { name: wsn-service, count: 1 }
  - { name: wsn-service-worker, count: 1 }
  - { name: wsn-ai-service, count: 1 }
  - { name: wsn-observer, count: 1 }
  - { name: console, count: 1 }
patches:
  - target: { kind: ConfigMap, name: wsn-service }
    patch: |
      - { op: replace, path: /data/WSN_ENV, value: development }
      - { op: replace, path: /data/WSN_DEMO_MODE, value: "true" }
      - { op: replace, path: /data/LOG_LEVEL, value: DEBUG }
      - { op: replace, path: /data/CORS_ALLOWED_ORIGINS, value: https://workspace.twotakeone.com }
  - target: { kind: ConfigMap, name: console }
    patch: |
      - op: replace
        path: /data/config.js
        value: |
          window.__RUNTIME_CONFIG__ = { organizationName: "Northwind Retail", installationName: "WorkspaceNow (dev)", version: "dev", mockLatencyMs: 0, apiBaseUrl: "https://api.workspace.twotakeone.com" };
  - target: { kind: HTTPRoute, name: console }
    patch: |
      - { op: replace, path: /spec/hostnames, value: [workspace.twotakeone.com] }
  - target: { kind: HTTPRoute, name: api }
    patch: |
      - { op: replace, path: /spec/hostnames, value: [api.workspace.twotakeone.com] }
  - target: { kind: HTTPRoute, name: mcp }
    patch: |
      - { op: replace, path: /spec/hostnames, value: [ai.workspace.twotakeone.com] }
  - target: { kind: HTTPRoute, name: observer }
    patch: |
      - { op: replace, path: /spec/hostnames, value: [obs.workspace.twotakeone.com] }
