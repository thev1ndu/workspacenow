# Event infrastructure: JetStream carries the outbox events to workflows and live updates.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
  namespace: workspacenow
spec:
  interval: 1h
  chart:
    spec:
      chart: nats
      version: "1.x"
      sourceRef: { kind: HelmRepository, name: nats, namespace: flux-system }
  values:
    config:
      cluster: { enabled: true, replicas: 3 }
      jetstream:
        enabled: true
        fileStore:
          pvc: { size: 20Gi }
