# Layer 03: gateway + TLS, in-cluster registry, kaniko image builds.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 03-platform
  namespace: flux-system
spec:
  dependsOn:
    - name: 02-services
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./deploy/flux/layers/03-platform
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
