# OpenBao, reached with the Kubernetes auth role external-secrets.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# OpenBao setup (auth, roles, placeholder secrets); substitution is off so the shell ${...} survives.
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-config
  namespace: openbao
  annotations: { kustomize.toolkit.fluxcd.io/substitute: disabled }
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bao
          image: openbao/openbao:2.1.0
          env:
            - { name: BAO_ADDR, value: "http://openbao.openbao.svc:8200" }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for i in $(seq 1 60); do bao status >/dev/null 2>&1 && break; sleep 5; done
              bao login root >/dev/null
              bao auth list -format=json | grep -q kubernetes || bao auth enable kubernetes
              bao read auth/kubernetes/config >/dev/null 2>&1 || bao write auth/kubernetes/config kubernetes_host=https://kubernetes.default.svc kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              bao policy write workspacenow-read - <<'POL'
              path "secret/data/workspacenow/*" { capabilities = ["read", "list", "update"] }
              path "secret/metadata" { capabilities = ["list"] }
              path "secret/metadata/workspacenow" { capabilities = ["read", "list"] }
              path "secret/metadata/workspacenow/*" { capabilities = ["read", "list"] }
              POL
              bao write auth/kubernetes/role/external-secrets bound_service_account_names=external-secrets bound_service_account_namespaces=external-secrets policies=workspacenow-read ttl=1h
              bao write auth/kubernetes/role/wsn-service bound_service_account_names=wsn-service bound_service_account_namespaces=workspacenow policies=workspacenow-read ttl=1h
              bao secrets list -format=json | grep -q '"secret/"' || bao secrets enable -path=secret kv-v2
              seed() { # seed <path> <key=value...>, write only when the key is empty, never clobber
                path="$1"; shift
                for kv in "$@"; do key="${kv%%=*}"
                  cur=$(bao kv get -field="$key" -mount=secret "$path" 2>/dev/null || true)
                  [ -n "$cur" ] || bao kv put -mount=secret "$path" "$kv" >/dev/null
                done
              }
              seed workspacenow/mistral apiKey=change-me
              seed workspacenow/ai-service token=change-me
              seed workspacenow/observer token=change-me
              seed workspacenow/run-grant privateKey=change-me
              seed workspacenow/object-storage accessKey=workspacenow secretKey=workspacenow-secret
              seed workspacenow/temporal-db password=temporal-dev
              seed workspacenow/default-admin email=admin@workspacenow.local password=$(head -c 24 /dev/urandom | base64 | tr -d '\n')
              echo "openbao configured"
