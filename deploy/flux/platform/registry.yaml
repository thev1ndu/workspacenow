# In-cluster OCI registry (registry:2) behind the kgateway gateway; TLS terminates at the
# gateway (cert tls-registry), the registry itself serves plain HTTP on 5000.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: workspacenow
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: registry }
  template:
    metadata:
      labels: { app.kubernetes.io/name: registry }
    spec:
      containers:
        - name: registry
          image: registry:2
          ports: [{ containerPort: 5000 }]
          env:
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
          resources: { requests: { cpu: 100m, memory: 256Mi } }
      volumes:
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: workspacenow
spec:
  selector: { app.kubernetes.io/name: registry }
  ports: [{ port: 5000, targetPort: 5000 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: registry
  namespace: workspacenow
spec:
  parentRefs:
    - { name: workspacenow, namespace: workspacenow }
  hostnames: ["registry.workspace.twotakeone.com"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: registry, port: 5000 }]
