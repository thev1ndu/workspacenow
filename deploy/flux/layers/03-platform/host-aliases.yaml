# Pin registry.${domain} to the gateway IP in each node's /etc/hosts so kubelet can pull from it.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: registry-host-alias
  namespace: workspacenow
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: registry-host-alias }
  template:
    metadata:
      labels: { app.kubernetes.io/name: registry-host-alias }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: pin
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            # /etc/hosts is a bind-mounted file: rewrite in place, and replace any stale IP for the registry host
            - grep -v 'registry.${domain}' /etc/hosts > /tmp/hosts.new && echo '${gateway_ip} registry.${domain}' >> /tmp/hosts.new && cat /tmp/hosts.new > /etc/hosts
          volumeMounts:
            - { name: hosts, mountPath: /etc/hosts }
          securityContext: { privileged: true }
      containers:
        - name: pause
          image: busybox:1.36
          command: ["sleep", "infinity"]
      volumes:
        - { name: hosts, hostPath: { path: /etc/hosts, type: File } }
