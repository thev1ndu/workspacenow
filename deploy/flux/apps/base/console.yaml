# Runtime settings the console reads before React mounts; the overlay sets apiBaseUrl per environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wsn-console
data:
  config.js: |
    window.__RUNTIME_CONFIG__ = {
      organizationName: "WorkspaceNow",
      installationName: "WorkspaceNow",
      version: "0.1.0",
      mockLatencyMs: 0,
      apiBaseUrl: "",
    };
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wsn-console
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: wsn-console }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wsn-console }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: console
          image: wsn-console
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PORT, value: "8080" }
          volumeMounts:
            - name: config
              mountPath: /workspace/apps/web-ui/dist/config.js
              subPath: config.js
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      volumes:
        - name: config
          configMap: { name: wsn-console }
---
apiVersion: v1
kind: Service
metadata:
  name: wsn-console
spec:
  selector: { app.kubernetes.io/name: wsn-console }
  ports:
    - { name: http, port: 8080, targetPort: http }
