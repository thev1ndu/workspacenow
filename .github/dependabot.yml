# Dependabot keeps every dependency in the repo current: GitHub Actions, Docker base images
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/wsn-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/wsn-ai-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/wsn-observer"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/console"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/deploy/compose"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/wsn-service"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: "gomod"
    directory: "/wsn-observer"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/console"
    schedule:
      interval: "weekly"
    # typescript-eslint 8.x supports typescript <6.1 only; the pnpm override pins 6.0.3.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/wsn-ai-service"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]
