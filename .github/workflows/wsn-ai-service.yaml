name: wsn-ai-service

# Dedicated pipeline for the AI service: lint, type check, and unit tests gated at 100% line
# coverage of src (see T0D0.md). The live smoke test against Mistral runs only when the
# MISTRAL_API_KEY secret is configured; without it the live tests skip.
on:
  pull_request:
    paths: ["wsn-ai-service/**", ".github/workflows/wsn-ai-service.yaml"]
  push:
    branches: [main]
    paths: ["wsn-ai-service/**", ".github/workflows/wsn-ai-service.yaml"]
  workflow_dispatch:

concurrency:
  group: wsn-ai-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wsn-ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wsn-ai-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      # The coverage gate: every line of src must be exercised by the unit tests.
      - run: pytest --cov=src --cov-report=term-missing --cov-fail-under=100

  live-smoke:
    # Opt-in: needs the Mistral key as a repository secret; the step is skipped otherwise
    # (secrets are not allowed in job-level if, so the flag goes through env).
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_MISTRAL_KEY: ${{ secrets.MISTRAL_API_KEY != '' }}
    defaults:
      run:
        working-directory: wsn-ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wsn-ai-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Live smoke test against Mistral (POST /v1/runs with a real key)
        if: ${{ env.HAS_MISTRAL_KEY == 'true' }}
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          AI_SERVICE_TOKEN: ${{ secrets.AI_SERVICE_TOKEN }}
        run: pytest tests/test_live_smoke.py -v
