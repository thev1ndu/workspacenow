# Instances of the operators installed by infrastructure/controllers.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wsn-db
  namespace: workspacenow
spec:
  instances: 3
  storage:
    size: 20Gi
  bootstrap:
    initdb:
      database: workspacenow
      owner: workspacenow
      postInitSQL:
        - CREATE ROLE temporal LOGIN
        - CREATE DATABASE temporal OWNER temporal
        - CREATE DATABASE temporal_visibility OWNER temporal
  managed:
    roles:
      - name: temporal
        ensure: present
        login: true
        passwordSecret:
          name: temporal-db-login
---
# OpenBao, reached with the Kubernetes auth role external-secrets.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# Platform secrets; values live in OpenBao under secret/workspacenow and never in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wsn-secrets
  namespace: workspacenow
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: wsn-secrets }
  data:
    - { secretKey: MISTRAL_API_KEY, remoteRef: { key: workspacenow/mistral, property: apiKey } }
    - { secretKey: AI_SERVICE_TOKEN, remoteRef: { key: workspacenow/ai-service, property: token } }
    - { secretKey: OBSERVER_TOKEN, remoteRef: { key: workspacenow/observer, property: token } }
    - { secretKey: RUN_GRANT_KEY, remoteRef: { key: workspacenow/run-grant, property: privateKey } }
    - { secretKey: S3_ACCESS_KEY, remoteRef: { key: workspacenow/object-storage, property: accessKey } }
    - { secretKey: S3_SECRET_KEY, remoteRef: { key: workspacenow/object-storage, property: secretKey } }
---
# Object-storage credentials for the RustFS deployment, pulled from OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wsn-rustfs-env
  namespace: workspacenow
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: wsn-rustfs-env
    template:
      data:
        accessKey: "{{ .accessKey }}"
        secretKey: "{{ .secretKey }}"
  data:
    - { secretKey: accessKey, remoteRef: { key: workspacenow/object-storage, property: accessKey } }
    - { secretKey: secretKey, remoteRef: { key: workspacenow/object-storage, property: secretKey } }
---
# Object storage for documents and release artifacts: RustFS (S3-compatible, MinIO-compatible
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: workspacenow
spec:
  replicas: 1
  selector: { matchLabels: { app: rustfs } }
  template:
    metadata:
      labels: { app: rustfs }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: rustfs
          image: docker.io/rustfs/rustfs:1.0.4
          args: ["server", "/data"]
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: wsn-rustfs-env, key: accessKey } }
            - name: RUSTFS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: wsn-rustfs-env, key: secretKey } }
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: rustfs-data }
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: workspacenow
spec:
  selector: { app: rustfs }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: workspacenow
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi

---
# Durable workflow execution, persisted in the wsn-db CloudNativePG cluster above.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
  namespace: temporal
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: temporal
      version: "0.x"
      sourceRef: { kind: HelmRepository, name: temporal, namespace: flux-system }
  values:
    cassandra: { enabled: false }
    mysql: { enabled: false }
    postgresql: { enabled: false }
    elasticsearch: { enabled: false }
    prometheus: { enabled: false }
    grafana: { enabled: false }
    server:
      config:
        persistence:
          default:
            driver: sql
            sql:
              driver: postgres12
              host: wsn-db-rw.workspacenow.svc
              port: 5432
              database: temporal
              user: temporal
              existingSecret: temporal-db
          visibility:
            driver: sql
            sql:
              driver: postgres12
              host: wsn-db-rw.workspacenow.svc
              port: 5432
              database: temporal_visibility
              user: temporal
              existingSecret: temporal-db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-db
  namespace: workspacenow
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: temporal-db-login
    template:
      type: kubernetes.io/basic-auth
      data:
        username: temporal
        password: "{{ .password }}"
  data:
    - { secretKey: password, remoteRef: { key: workspacenow/temporal-db, property: password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-db
  namespace: temporal
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: temporal-db }
  data:
    - { secretKey: password, remoteRef: { key: workspacenow/temporal-db, property: password } }
