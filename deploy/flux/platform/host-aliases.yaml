# Single-node dev cluster: kubelet resolves image hosts via the node's /etc/hosts, so pin the
# in-cluster registry hostname to the gateway IP here (public DNS for the domain goes through
# Cloudflare, whose origin is configured separately).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: registry-host-alias
  namespace: workspacenow
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: registry-host-alias }
  template:
    metadata:
      labels: { app.kubernetes.io/name: registry-host-alias }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: pin
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            # /etc/hosts is a bind-mounted file: rewrite in place, and replace any stale IP for the registry host
            - grep -v 'registry.workspace.twotakeone.com' /etc/hosts > /tmp/hosts.new && echo '169.58.222.25 registry.workspace.twotakeone.com' >> /tmp/hosts.new && cat /tmp/hosts.new > /etc/hosts
          volumeMounts:
            - { name: hosts, mountPath: /etc/hosts }
          securityContext: { privileged: true }
      containers:
        - name: pause
          image: busybox:1.36
          command: ["sleep", "infinity"]
      volumes:
        - { name: hosts, hostPath: { path: /etc/hosts, type: File } }
