apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
# Staging pins a release; bump these tags to promote one.
images:
  - { name: ghcr.io/thev1ndu/wsn-service, newTag: "0.1.0" }
  - { name: ghcr.io/thev1ndu/wsn-ai-service, newTag: "0.1.0" }
  - { name: ghcr.io/thev1ndu/console, newTag: "0.1.0" }
patches:
  - target: { kind: ConfigMap, name: wsn-service }
    patch: |
      - { op: replace, path: /data/CORS_ALLOWED_ORIGINS, value: https://staging.workspacenow.example.com }
  - target: { kind: ConfigMap, name: console }
    patch: |
      - op: replace
        path: /data/config.js
        value: |
          window.__RUNTIME_CONFIG__ = { organizationName: "WorkspaceNow", installationName: "WorkspaceNow (staging)", version: "0.1.0", mockLatencyMs: 0, apiBaseUrl: "https://staging.workspacenow.example.com" };
  - target: { kind: HTTPRoute, name: workspacenow }
    patch: |
      - { op: replace, path: /spec/hostnames, value: [staging.workspacenow.example.com] }
