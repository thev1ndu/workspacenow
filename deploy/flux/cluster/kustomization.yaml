# Cluster entry point synced by flux-system: the layers apply in order, each waiting on the previous one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-vars.yaml
  - 00-foundation.yaml
  - 01-secrets-data.yaml
  - 02-services.yaml
  - 03-platform.yaml
  - 04-apps.yaml
