# Operators whose CRDs the later layers use: CloudNativePG (01 wsn-db), External Secrets (01 secret sync), OpenBao.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.x"
      sourceRef: { kind: HelmRepository, name: cnpg, namespace: flux-system }
  install: { crds: Create }
  upgrade: { crds: CreateReplace }
---
# Syncs platform secrets from OpenBao into Kubernetes Secrets.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: "0.x"
      sourceRef: { kind: HelmRepository, name: external-secrets, namespace: flux-system }
  install: { crds: Create }
  upgrade: { crds: CreateReplace }
  values:
    installCRDs: true
---
# Secrets manager: integration credentials and platform secrets; wsn-service keeps only their paths.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 1h
  chart:
    spec:
      chart: openbao
      version: "0.x"
      sourceRef: { kind: HelmRepository, name: openbao, namespace: flux-system }
  values:
    injector: { enabled: false }
    server:
      standalone:
        enabled: true
      dev:
        enabled: true
        devRootToken: root
      dataStorage: { size: 5Gi }
