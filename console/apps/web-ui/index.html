<!doctype html>
<html lang="en" class="cds--white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WorkspaceNow: build, connect and operate your organization's applications, agents and workflows." />
    <title>WorkspaceNow</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved Carbon theme (white, g10, g90, g100 or system) before first paint, so the page never flashes. Mirrors useCarbonTheme (THEME_STORAGE_KEY).
      (function () {
        try {
          var themes = ["white", "g10", "g90", "g100"];
          var saved = localStorage.getItem("workspacenow-carbon-theme");
          var theme = themes.indexOf(saved) >= 0 ? saved : window.matchMedia("(prefers-color-scheme: dark)").matches ? "g100" : "white";
          document.documentElement.className = "cds--" + theme;
        } catch (e) {}
      })();
    </script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
