# Instances of the operators installed by infrastructure/controllers.
# PostgreSQL for entity persistence and platform metadata, plus Temporal's databases.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wsn-db
  namespace: workspacenow
spec:
  instances: 3
  storage:
    size: 20Gi
  bootstrap:
    initdb:
      database: workspacenow
      owner: workspacenow
      postInitSQL:
        - CREATE ROLE temporal LOGIN
        - CREATE DATABASE temporal OWNER temporal
        - CREATE DATABASE temporal_visibility OWNER temporal
  managed:
    roles:
      - name: temporal
        ensure: present
        login: true
        passwordSecret:
          name: temporal-db-login
---
# OpenBao, reached with the Kubernetes auth role external-secrets.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# Platform secrets; values live in OpenBao under secret/workspacenow and never in git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wsn-secrets
  namespace: workspacenow
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: wsn-secrets }
  data:
    - { secretKey: MISTRAL_API_KEY, remoteRef: { key: workspacenow/mistral, property: apiKey } }
    - { secretKey: AI_SERVICE_TOKEN, remoteRef: { key: workspacenow/ai-service, property: token } }
    - { secretKey: RUN_GRANT_KEY, remoteRef: { key: workspacenow/run-grant, property: privateKey } }
    - { secretKey: S3_ACCESS_KEY, remoteRef: { key: workspacenow/object-storage, property: accessKey } }
    - { secretKey: S3_SECRET_KEY, remoteRef: { key: workspacenow/object-storage, property: secretKey } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: temporal-db
  namespace: workspacenow
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: temporal-db-login
    template:
      type: kubernetes.io/basic-auth
      data:
        username: temporal
        password: "{{ .password }}"
  data:
    - { secretKey: password, remoteRef: { key: workspacenow/temporal-db, property: password } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: temporal-db
  namespace: temporal
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: temporal-db }
  data:
    - { secretKey: password, remoteRef: { key: workspacenow/temporal-db, property: password } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wsn-minio-env
  namespace: workspacenow
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: wsn-minio-env
    template:
      data:
        config.env: |
          export MINIO_ROOT_USER="{{ .accessKey }}"
          export MINIO_ROOT_PASSWORD="{{ .secretKey }}"
  data:
    - { secretKey: accessKey, remoteRef: { key: workspacenow/object-storage, property: accessKey } }
    - { secretKey: secretKey, remoteRef: { key: workspacenow/object-storage, property: secretKey } }
---
# Object storage for documents and release artifacts.
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: wsn-minio
  namespace: workspacenow
spec:
  configuration:
    name: wsn-minio-env
  requestAutoCert: false
  buckets:
    - name: workspacenow
  pools:
    - name: pool-0
      servers: 4
      volumesPerServer: 2
      volumeClaimTemplate:
        metadata:
          name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi
