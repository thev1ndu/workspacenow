name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"] # release tags run the full suite (incl. e2e) before images build

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists a PR's changed files

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.filter.outputs.service }}
      observer: ${{ steps.filter.outputs.observer }}
      console: ${{ steps.filter.outputs.console }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            service: ['wsn-service/**', 'openapi.yaml']
            observer: ['wsn-observer/**']
            console: ['console/**']
            deploy: ['deploy/**']
            # wsn-ai-service/** is covered by .github/workflows/wsn-ai-service.yaml

  wsn-service:
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wsn-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wsn-service/go.mod
          cache-dependency-path: wsn-service/go.sum
      - name: Generated code is current
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.6.0 -config api/oapi-codegen.yaml ../openapi.yaml
          sh scripts/gen-unimplemented.sh
          git diff --exit-code -- internal/oapi api/unimplemented_gen.go
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
      - run: go test -race -covermode=atomic ./...
      - run: go build ./...

  wsn-observer:
    needs: changes
    if: needs.changes.outputs.observer == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wsn-observer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wsn-observer/go.mod
          cache-dependency-path: wsn-observer/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
      - run: go test -race -covermode=atomic ./...
      - run: go build ./...

  console:
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @workspacenow/mock-server test:coverage
      - run: pnpm build

  # Full e2e: boot the whole compose stack and run the flagship smoke against the live API.
  e2e:
    needs: changes
    if: needs.changes.outputs.service == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Boot the compose stack
        run: |
          docker compose -f deploy/compose/docker-compose.yml --profile app up -d --build || {
            echo "::error::compose up failed — container states and logs:"
            docker compose -f deploy/compose/docker-compose.yml --profile app ps -a
            docker compose -f deploy/compose/docker-compose.yml --profile app logs --tail=300
            exit 1
          }
      - name: Run e2e smoke
        run: bash deploy/e2e/smoke.sh
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose/docker-compose.yml --profile app ps -a
          docker compose -f deploy/compose/docker-compose.yml --profile app logs --tail=300
      - name: Teardown
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml --profile app down -v

  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fluxcd/flux2/action@main
      - name: Render every Flux overlay
        run: |
          for dir in deploy/flux/infrastructure/controllers deploy/flux/infrastructure/configs deploy/flux/apps/dev deploy/flux/apps/staging deploy/flux/apps/prod; do
            echo "::group::$dir"
            kubectl kustomize "$dir" > /dev/null
            echo "::endgroup::"
          done
