# Layer 04: wsn-service, wsn-ai-service, wsn-observer, console.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 04-apps
  namespace: flux-system
spec:
  dependsOn:
    - name: 03-platform
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deploy/flux/layers/04-apps
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
