name: images

# Builds every image with Cloud Native Buildpacks and pushes it to GHCR. Flux image automation picks up main-* tags for dev.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  BUILDER: paketobuildpacks/builder-jammy-base

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: wsn-service
            path: wsn-service
          - image: wsn-ai-service
            path: wsn-ai-service
          - image: wsn-console
            path: console
    steps:
      - uses: actions/checkout@v4
      - uses: buildpacks/github-actions/setup-pack@v5.8.0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          sha="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "primary=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "extra=--tag ${REGISTRY}/${{ matrix.image }}:latest" >> "$GITHUB_OUTPUT"
          else
            # Ordered by run number so Flux's ImagePolicy can pick the newest main build.
            echo "primary=main-${sha}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "extra=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish
        run: |
          pack build "${REGISTRY}/${{ matrix.image }}:${{ steps.tags.outputs.primary }}" \
            --path "${{ matrix.path }}" \
            --builder "${BUILDER}" \
            --env "BP_OCI_REVISION=${GITHUB_SHA}" \
            --env "BP_GO_BUILD_LDFLAGS=-s -w -X github.com/thev1ndu/workspacenow/wsn-service/config.Version=${{ steps.tags.outputs.primary }}" \
            --publish ${{ steps.tags.outputs.extra }}
