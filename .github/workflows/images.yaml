name: images

# Builds every image from its component Dockerfile (multi-stage, non-root runtime user) with
# docker buildx and pushes it to GHCR. Flux image automation picks up main-* tags for dev.
on:
  # Build images only after the ci workflow (unit + e2e) succeeded for that ref —
  # never publish an image for a commit whose tests failed.
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: wsn-service
            path: wsn-service
          - image: wsn-ai-service
            path: wsn-ai-service
          - image: wsn-observer
            path: wsn-observer
          - image: console
            path: console
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          sha="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            names="${version} latest"
          else
            # Ordered by run number so Flux's ImagePolicy can pick the newest main build.
            version="main-${sha}-${GITHUB_RUN_NUMBER}"
            names="$version"
          fi
          tags=""
          for n in $names; do
            tags+="${REGISTRY}/${{ matrix.image }}:${n},"
          done
          echo "tags=${tags%,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.path }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
