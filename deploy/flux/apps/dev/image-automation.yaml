# Dev follows main: Flux finds the newest main-<sha>-<run> image and commits its tag to apps/dev.
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: wsn-service
  namespace: flux-system
spec:
  image: ghcr.io/thev1ndu/wsn-service
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: wsn-ai-service
  namespace: flux-system
spec:
  image: ghcr.io/thev1ndu/wsn-ai-service
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: wsn-console
  namespace: flux-system
spec:
  image: ghcr.io/thev1ndu/wsn-console
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: wsn-service
  namespace: flux-system
spec:
  imageRepositoryRef: { name: wsn-service }
  filterTags: { pattern: '^main-[a-f0-9]+-(?P<run>[0-9]+)$', extract: '$run' }
  policy: { numerical: { order: asc } }
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: wsn-ai-service
  namespace: flux-system
spec:
  imageRepositoryRef: { name: wsn-ai-service }
  filterTags: { pattern: '^main-[a-f0-9]+-(?P<run>[0-9]+)$', extract: '$run' }
  policy: { numerical: { order: asc } }
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: wsn-console
  namespace: flux-system
spec:
  imageRepositoryRef: { name: wsn-console }
  filterTags: { pattern: '^main-[a-f0-9]+-(?P<run>[0-9]+)$', extract: '$run' }
  policy: { numerical: { order: asc } }
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: workspacenow-dev
  namespace: flux-system
spec:
  interval: 10m
  sourceRef: { kind: GitRepository, name: flux-system }
  git:
    checkout: { ref: { branch: main } }
    commit:
      author: { name: fluxcdbot, email: fluxcdbot@users.noreply.github.com }
      messageTemplate: "Update dev images"
    push: { branch: main }
  update:
    path: ./deploy/flux/apps/dev
    strategy: Setters
