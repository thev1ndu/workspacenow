server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA with push-state routing: unknown paths fall back to index.html.
    # /config.js is the runtime config Kubernetes mounts into the web root.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
