# HA overlay for the local stack: postgres primary + streaming replica, valkey + replica,
# two wsn-service instances, and a standby wsn-observer receiving replicated WAL segments.
# Usage: docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.ha.yml --profile app up -d
name: workspacenow

services:
  postgres:
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspacenow && pg_is_in_recovery() = false"]

  postgres-replica:
    profiles: ["app"]
    image: postgres:16-alpine
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGUSER: workspacenow
      PGPASSWORD: workspacenow
    entrypoint: >
      /bin/sh -c "until pg_isready -h postgres -U workspacenow; do sleep 1; done;
      rm -rf /var/lib/postgresql/data/*;
      pg_basebackup -h postgres -U workspacenow -D /var/lib/postgresql/data -Fp -Xs -R -c fast;
      exec docker-entrypoint.sh postgres"
    volumes: ["postgres-replica:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspacenow && pg_is_in_recovery() = true"]
      interval: 5s
      retries: 30

  valkey:
    command: ["valkey-server", "--appendonly", "yes"]

  valkey-replica:
    profiles: ["app"]
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--replicaof", "valkey", "6379"]
    depends_on: [valkey]

  wsn-observer:
    environment:
      WSN_OBSERVER_REPLICA_URL: http://wsn-observer-standby:9098

  wsn-observer-standby:
    profiles: ["app"]
    image: ghcr.io/thev1ndu/wsn-observer:${IMAGE_TAG:-main}
    build: ../../wsn-observer
    environment:
      WSN_OBSERVER_DATA_DIR: /data
      WSN_OBSERVER_TOKEN: ${OBSERVER_TOKEN:-}
    ports: ["9099:9098"]
    volumes: ["observer-standby:/data"]
    depends_on:
      volume-init: { condition: service_completed_successfully }

  wsn-service-2:
    profiles: ["app"]
    image: ghcr.io/thev1ndu/wsn-service:${IMAGE_TAG:-main}
    build: ../../wsn-service
    command: ["-server", "-relay"]
    environment:
      WSN_ENV: development
      WSN_DEMO_MODE: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-workspacenow}:${POSTGRES_PASSWORD:-workspacenow}@postgres:5432/${POSTGRES_DB:-workspacenow}?sslmode=disable
      REDIS_URL: redis://valkey:6379/0
      NATS_URL: nats://nats:4222
      TEMPORAL_HOSTPORT: temporal:7233
      S3_ENDPOINT: rustfs:9000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-workspacenow}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-workspacenow-secret}
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_ROOT_TOKEN:-root}
      AI_SERVICE_URL: http://wsn-ai-service:8090
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-service-token}
      WSN_OBSERVER_URL: http://wsn-observer:9098
      CORS_ALLOWED_ORIGINS: http://localhost:8088
    depends_on:
      wsn-service-migrate: { condition: service_completed_successfully }

volumes:
  postgres-replica: {}
  observer-standby: {}
