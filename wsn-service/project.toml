# Cloud Native Buildpacks descriptor: pack build wsn-service --builder paketobuildpacks/builder-jammy-base
[_]
schema-version = "0.2"
id = "workspacenow.wsn-service"
name = "wsn-service"

[io.buildpacks]
exclude = ["bin", ".env", "scripts/*.mjs"]

[[io.buildpacks.build.env]]
name = "BP_GO_TARGETS"
value = "./"

[[io.buildpacks.build.env]]
name = "BP_GO_BUILD_LDFLAGS"
value = "-s -w"
