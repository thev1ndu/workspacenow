[project]
name = "wsn-ai-service"
description = "WorkspaceNow AI service: governed agent runs on Mistral, the Application Architect and the managed MCP server"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"
license = {text = "Apache-2.0"}

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "fastmcp>=4.1,<5",
  "mistralai>=3.7,<4",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff==0.17.3",
  "mypy>=1.11",
]

[project.scripts]
wsn-ai-service = "wsn_ai_service.app:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/wsn_ai_service"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: opt-in smoke tests against the real Mistral API; skip unless MISTRAL_API_KEY is set",
]
