# In-cluster image builds. Kaniko Jobs compile each component from the public
# repo with its existing Dockerfile and push to the in-cluster registry
# (registry.workspace.twotakeone.com; dev: registry.workspace.twotakeone.com).
# kpack (buildpacks) is installed alongside as the buildpacks path — see
# DEPLOY-DEV.md; these Jobs are the source of truth for the deployed tags.
apiVersion: batch/v1
kind: Job
metadata:
  name: build-wsn-service
  namespace: workspacenow
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      hostAliases:
        - { ip: 169.58.222.26, hostnames: ["registry.workspace.twotakeone.com"] }
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            - --dockerfile=Dockerfile
            - --context-sub-path=wsn-service
            - --context=git://github.com/thev1ndu/workspacenow.git#refs/heads/main
            - --destination=registry.workspace.twotakeone.com/wsn-service:dev
            - --snapshot-mode=redo
            - --verbosity=info
          resources: { requests: { cpu: 500m, memory: 1Gi } }
