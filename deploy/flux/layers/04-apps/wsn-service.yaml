apiVersion: v1
kind: ConfigMap
metadata:
  name: wsn-service
data:
  WSN_ENV: development
  WSN_DEMO_MODE: "false"
  LOG_LEVEL: DEBUG
  REDIS_URL: redis://valkey:6379/0
  NATS_URL: nats://nats:4222
  TEMPORAL_HOSTPORT: temporal-frontend.temporal.svc:7233
  TEMPORAL_NAMESPACE: default
  S3_ENDPOINT: rustfs.workspacenow.svc:9000
  S3_BUCKET: workspacenow
  OPENBAO_ADDR: http://openbao.openbao.svc:8200
  OPENBAO_ROLE: wsn-service
  AI_SERVICE_URL: http://wsn-ai-service:8090
  WSN_OBSERVER_URL: http://wsn-observer:9098
  CORS_ALLOWED_ORIGINS: https://${domain}
  OIDC_ISSUER: ""
  OIDC_AUDIENCE: ""
  OIDC_JWKS_URL: ""
  # First administrators: users with these IdP emails get WSN_BOOTSTRAP_ADMIN_ROLE on first login.
  WSN_BOOTSTRAP_ADMIN_ROLE: workspacenow-admin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wsn-service
---
# Applies migrations before new pods start; Flux replaces the job on every change.
apiVersion: batch/v1
kind: Job
metadata:
  name: wsn-service-migrate
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: wsn-service-migrate }
    spec:
      restartPolicy: OnFailure
      serviceAccountName: wsn-service
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: wsn-service
          imagePullPolicy: Always
          args: ["-migrate", "-server=false"]
          envFrom:
            - configMapRef: { name: wsn-service }
            - secretRef: { name: wsn-secrets }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: wsn-db-app, key: uri } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wsn-service
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: wsn-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wsn-service }
    spec:
      serviceAccountName: wsn-service
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: wsn-service
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
            - { name: internal, containerPort: 8081 }
          envFrom:
            - configMapRef: { name: wsn-service }
            - secretRef: { name: wsn-secrets }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: wsn-db-app, key: uri } }
            - name: AI_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: wsn-secrets, key: AI_SERVICE_TOKEN } }
            - name: WSN_LOCAL_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: wsn-secrets, key: WSN_LOCAL_ADMIN_EMAIL } }
            - name: WSN_LOCAL_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: wsn-secrets, key: WSN_LOCAL_ADMIN_PASSWORD } }
            - name: WSN_OBSERVER_TOKEN
              valueFrom: { secretKeyRef: { name: wsn-secrets, key: OBSERVER_TOKEN } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
# Moves committed events from the outbox to NATS; more than one replica is safe (SKIP LOCKED).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wsn-service-relay
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: wsn-service-relay }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wsn-service-relay }
    spec:
      serviceAccountName: wsn-service
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: relay
          image: wsn-service
          imagePullPolicy: Always
          args: ["-server=false", "-relay"]
          envFrom:
            - configMapRef: { name: wsn-service }
            - secretRef: { name: wsn-secrets }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: wsn-db-app, key: uri } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
# Temporal worker and event-trigger consumer for workflows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wsn-service-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: wsn-service-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wsn-service-worker }
    spec:
      serviceAccountName: wsn-service
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: wsn-service
          imagePullPolicy: Always
          args: ["-server=false", "-worker"]
          envFrom:
            - configMapRef: { name: wsn-service }
            - secretRef: { name: wsn-secrets }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: wsn-db-app, key: uri } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata:
  name: wsn-service
spec:
  selector: { app.kubernetes.io/name: wsn-service }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: internal, port: 8081, targetPort: internal }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wsn-service
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: wsn-service }
