# kgateway Gateway for the installation plus the TLS certificates for the four
# hostnames. Dev patches the dnsNames to workspace.twotakeone.com etc.
# The ClusterIssuer "letsencrypt-dns" (DNS-01) must exist in the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: workspacenow
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: workspacenow
  namespace: workspacenow
spec:
  gatewayClassName: kgateway
  listeners:
    - { name: http, protocol: HTTP, port: 80, allowedRoutes: { namespaces: { from: Same } } }
    - name: https-console
      protocol: HTTPS
      port: 443
      hostname: console.workspace.twotakeone.com
      tls: { mode: Terminate, certificateRefs: [{ name: tls-console }] }
      allowedRoutes: { namespaces: { from: Same } }
    - name: https-api
      protocol: HTTPS
      port: 443
      hostname: api.workspace.twotakeone.com
      tls: { mode: Terminate, certificateRefs: [{ name: tls-api }] }
      allowedRoutes: { namespaces: { from: Same } }
    - name: https-ai
      protocol: HTTPS
      port: 443
      hostname: ai.workspace.twotakeone.com
      tls: { mode: Terminate, certificateRefs: [{ name: tls-ai }] }
      allowedRoutes: { namespaces: { from: Same } }
    - name: https-obs
      protocol: HTTPS
      port: 443
      hostname: obs.workspace.twotakeone.com
      tls: { mode: Terminate, certificateRefs: [{ name: tls-obs }] }
      allowedRoutes: { namespaces: { from: Same } }
    - name: https-registry
      protocol: HTTPS
      port: 443
      hostname: registry.workspace.twotakeone.com
      tls: { mode: Terminate, certificateRefs: [{ name: tls-registry }] }
      allowedRoutes: { namespaces: { from: Same } }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-console
  namespace: workspacenow
spec:
  secretName: tls-console
  dnsNames: ["console.workspace.twotakeone.com"]
  issuerRef: { name: letsencrypt-dns, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-api
  namespace: workspacenow
spec:
  secretName: tls-api
  dnsNames: ["api.workspace.twotakeone.com"]
  issuerRef: { name: letsencrypt-dns, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-ai
  namespace: workspacenow
spec:
  secretName: tls-ai
  dnsNames: ["ai.workspace.twotakeone.com"]
  issuerRef: { name: letsencrypt-dns, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-obs
  namespace: workspacenow
spec:
  secretName: tls-obs
  dnsNames: ["obs.workspace.twotakeone.com"]
  issuerRef: { name: letsencrypt-dns, kind: ClusterIssuer }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-registry
  namespace: workspacenow
spec:
  secretName: tls-registry
  dnsNames: ["registry.workspace.twotakeone.com"]
  issuerRef: { name: letsencrypt-dns, kind: ClusterIssuer }
