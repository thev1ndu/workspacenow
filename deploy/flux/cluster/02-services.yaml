# Layer 02: NATS, Valkey, RustFS, Temporal.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 02-services
  namespace: flux-system
spec:
  dependsOn:
    - name: 01-secrets-data
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deploy/flux/layers/02-services
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
