# Object storage for documents and release artifacts: RustFS (S3-compatible); credentials from layer 01.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: workspacenow
spec:
  replicas: 1
  selector: { matchLabels: { app: rustfs } }
  template:
    metadata:
      labels: { app: rustfs }
    spec:
      # the rustfs image uses a non-numeric user, so runAsNonRoot cannot be verified
      securityContext: { runAsNonRoot: false, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: rustfs
          image: docker.io/rustfs/rustfs:1.0.4
          args: ["server", "/data"]
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: wsn-rustfs-env, key: accessKey } }
            - name: RUSTFS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: wsn-rustfs-env, key: secretKey } }
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: rustfs-data }
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: workspacenow
spec:
  selector: { app: rustfs }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: workspacenow
  annotations: { kustomize.toolkit.fluxcd.io/prune: disabled }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
